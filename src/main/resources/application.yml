server:
  port: 8080

spring:
  application:
    name: wedding-store-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/wedding_store
    username: navyakonda
    password: 

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true	
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: change_this_to_a_very_long_secret_key_for_jwt_security_123456789
    expiration-ms: 86400000
aws:
   s3:
     bucket: wedding-store-dev
     region: us-east-2

  